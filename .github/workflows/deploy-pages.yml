name: Publicar site estatico no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pasta de publicacao
        run: |
          mkdir -p site-publicado
          cp -r public/. site-publicado/
          touch site-publicado/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-publicado

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
