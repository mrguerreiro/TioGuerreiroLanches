services:
  - type: web
    name: tio-guerreiro-lanches
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAGSEGURO_TOKEN
        sync: false
      - key: PAGSEGURO_SANDBOX
        value: "true"
      # MongoDB Atlas (gratuito, igual ao wilboor.com.br). Tem prioridade sobre DATABASE_URL.
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tio-guerreiro-db
          property: connectionString

databases:
  - name: tio-guerreiro-db
    plan: free
