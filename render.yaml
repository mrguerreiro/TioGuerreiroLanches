services:
  - type: web
    name: tio-guerreiro-lanches
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAGSEGURO_TOKEN
        sync: false
      - key: PAGSEGURO_SANDBOX
        value: "true"
      # Domínio próprio (https://tioguerreirolanches.com.br). Só preencha no painel do Render depois que o
      # domínio já abrir o site, senão o endereço do Render passa a redirecionar para um domínio que não responde.
      - key: SITE_URL
        sync: false
      # MongoDB Atlas (gratuito, igual ao wilboor.com.br).
      - key: MONGODB_URI
        sync: false
      # Taxa de entrega por distância (OpenRouteService). Sem ela, vale a taxa fixa do painel.
      - key: ORS_API_KEY
        sync: false
